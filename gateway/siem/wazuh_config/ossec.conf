<!-- Wazuh SIEM Local Agent Configuration for Sovereign Industrial Node -->
<ossec_config>
  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Monitor Sovereign AI audit logs for security anomalies -->
  <localfile>
    <log_format>json</log_format>
    <location>/app/gateway/siem/audit_logs.jsonl</location>
  </localfile>

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <!-- Integrity monitoring of models and modelfiles -->
    <directories check_all="yes">/root/.ollama/models</directories>
  </syscheck>
</ossec_config>
