model_list:
  - model_name: llama3.2
    litellm_params:
      model: ollama/llama3.2
      api_base: http://localhost:11434
      timeout: 120

  - model_name: llava
    litellm_params:
      model: ollama/llava
      api_base: http://localhost:11434
      timeout: 180

  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://localhost:11434

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 120

general_settings:
  master_key: sk-sovereign-airgap-internal-token-2026
  alerting: ["slack"] # or local webhook in air gap
